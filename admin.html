<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>抽奖后台管理</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Lottery Admin</p>
          <h1>抽奖后台管理</h1>
        </div>
        <a class="preview-link" href="/" target="_blank">打开前台</a>
      </header>

      <section class="panel settings-panel">
        <div class="section-title">
          <h2>活动设置</h2>
          <span id="saveState">未保存</span>
        </div>
        <div class="settings-grid">
          <label>
            <span>活动标题</span>
            <input id="titleInput" type="text" />
          </label>
          <label>
            <span>每日次数</span>
            <input id="dailyChancesInput" type="number" min="1" step="1" />
          </label>
          <label>
            <span>参与人数</span>
            <input id="participantInput" type="number" min="0" step="1" />
          </label>
          <label>
            <span>中奖率文案</span>
            <input id="winRateInput" type="text" />
          </label>
        </div>
      </section>

      <section class="panel">
        <div class="section-title">
          <div>
            <h2>奖品池与概率</h2>
            <p>权重越高，中奖概率越高；库存为 0 或关闭后不会被抽中。</p>
          </div>
          <button id="addPrizeButton" class="secondary-button" type="button">新增奖品</button>
        </div>

        <div id="prizeEditor" class="prize-editor"></div>

        <div class="action-row">
          <button id="saveButton" class="primary-button" type="button">保存配置</button>
          <button id="reloadButton" class="secondary-button" type="button">重新读取</button>
        </div>
      </section>

      <section class="panel">
        <div class="section-title">
          <h2>最近中奖记录</h2>
          <span>最多显示 20 条</span>
        </div>
        <div id="recordList" class="record-list"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="admin.js"></script>
  </body>
</html>
